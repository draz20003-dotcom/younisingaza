<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوني للتبرعات - YOUNIS GAZA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        header { 
            text-align: center; 
            padding: 80px 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 { font-size: 42px; margin-bottom: 20px; }
        .btn { 
            background: #ff6b6b; 
            color: white; 
            padding: 15px 40px; 
            border-radius: 30px; 
            text-decoration: none;
            font-size: 20px;
            display: inline-block;
            margin-top: 20px;
        }
        section {
            background: white;
            color: #333;
            padding: 60px 20px;
            text-align: center;
        }
        section h2 { 
            font-size: 32px; 
            margin-bottom: 20px;
            color: #667eea;
        }
        section p { 
            font-size: 18px; 
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <!-- القسم الاول -->
    <header>
        <h1>مرحبا في يوني للتبرعات</h1>
        <p>YOUNIS GAZA - معا نساعد بعض</p>
        <a href="#donate" class="btn">تبرع الان</a>
    </header>

    <!-- القسم الثاني من نحن -->
    <section>
        <h2>من نحن</h2>
        <p>مبادرة يوني للتبرعات تهدف لمساعدة اهلنا في غزة. بنوفر مساعدات غذائية وطبية وتعليمية لكل محتاج.</p>
    </section>

    <!-- القسم الثالث كيف تتبرع -->
    <section id="donate" style="background: #f5f5f5;">
        <h2>كيف تتبرع</h2>
        <p>تقدر تتبرع عن طريق التواصل معنا على واتساب. كل تبرع بيوصل لمستحقيه مباشرة.</p>
    </section>

    <!-- القسم الرابع تواصل -->
    <section>
        <h2>تواصل معنا</h2>
        <p>واتساب: 059XXXXXXX</p>
    </section>
</body>
</html>
